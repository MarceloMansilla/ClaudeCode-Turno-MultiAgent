services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: citaclara
      POSTGRES_PASSWORD: citaclara
      POSTGRES_DB: citaclara
    ports:
      - '5432:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citaclara']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  datos-postgres:
